</div></section>

<section class="wrap rates-fin" id="rates"><div>

<script>
function toggleNav(b){const m=document.getElementById('menu');b.setAttribute('aria-expanded',m.classList.toggle('open'))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function wk(d){return '週'+'日一二三四五六'[new Date(d+'T00:00:00').getDay()]}
fetch('news/index.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(data=>{
  const days=(data.days||[]).slice().sort((a,b)=>b.date<a.date?-1:1);
  const box=document.getElementById('days');
  if(!days.length){box.innerHTML='<p class="fin-note">目前尚無內容。</p>';return}
  box.innerHTML=days.map(d=>`<article class="fin-day"><h3>${esc(d.date)}（${wk(d.date)}）</h3><div class="fin-grid">`+
    d.items.map(it=>`<div class="fin-card"><h4><span>${esc(it.name)}</span><a class="fin-dl" href="${esc(it.pdf)}" download><svg class="si si-sm" aria-hidden="true"><use href="#i-down"/></svg>下載 PDF</a></h4><div class="fin-pages">`+
      it.previews.map((p,i)=>`<a href="${esc(it.pdf)}" target="_blank" rel="noopener" title="開啟 PDF"><img src="${esc(p)}" alt="${esc(it.name)} ${esc(d.date)} 第${i+1}頁預覽" loading="lazy"></a>`).join('')+
    `</div></div>`).join('')+`</div></article>`).join('');
}).catch(()=>{document.getElementById('days').innerHTML='<p class="fin-note">內容載入失敗，請稍後重新整理。</p>'});
</script>
